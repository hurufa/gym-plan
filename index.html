<!doctype html>
<!-- index.html
     App entry point. Holds the shell (skip link, navigation, main region); js/app.js renders the
     current hash route (#/plan, #/settings, ...) into <main>. Serve the folder (npx serve) to run it.
     Links the PWA manifest and icons; js/app.js registers sw.js for offline use. -->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="Training and meal plan from your goal and schedule. Works offline.">
  <title>Gym Plan</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Plan">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/animations.css">
  <script src="./js/file-notice.js"></script>
  <script src="./vendor/gsap.min.js" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app">
    <a class="skip-link" href="#main" data-i18n="common.skip">Skip to content</a>
    <nav class="nav" id="nav" hidden></nav>
    <main class="app-main" id="main" tabindex="-1"></main>
  </div>
</body>
</html>
